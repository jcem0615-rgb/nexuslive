<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Nexus Live">
  <defs>
    <linearGradient id="ogBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0747"/>
      <stop offset=".5" stop-color="#2b0a72"/>
      <stop offset="1" stop-color="#07060f"/>
    </linearGradient>
    <radialGradient id="ogGlow" cx=".2" cy=".15" r=".8">
      <stop offset="0" stop-color="#7036ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#7036ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ogGlow2" cx=".9" cy=".9" r=".6">
      <stop offset="0" stop-color="#ff2d6f" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ff2d6f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ogMark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a76ff"/>
      <stop offset=".48" stop-color="#6017f5"/>
      <stop offset="1" stop-color="#330d8c"/>
    </linearGradient>
    <linearGradient id="ogLive" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b96"/>
      <stop offset="1" stop-color="#ff1f64"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ogBg)"/>
  <rect width="1200" height="630" fill="url(#ogGlow)"/>
  <rect width="1200" height="630" fill="url(#ogGlow2)"/>

  <g transform="translate(96 150) scale(0.44)">
    <rect width="512" height="512" rx="116" fill="url(#ogMark)"/>
    <path d="M146 372V140l220 232V140" fill="none" stroke="#fff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#fff">
      <circle cx="146" cy="140" r="34"/>
      <circle cx="146" cy="372" r="34"/>
      <circle cx="366" cy="372" r="34"/>
    </g>
    <g fill="#5a14e0">
      <circle cx="146" cy="140" r="12"/>
      <circle cx="146" cy="372" r="12"/>
      <circle cx="366" cy="372" r="12"/>
    </g>
    <circle cx="366" cy="140" r="38" fill="#fff"/>
    <circle cx="366" cy="140" r="27" fill="url(#ogLive)"/>
  </g>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="372" y="296" font-size="96" font-weight="800" letter-spacing="-4" fill="#ffffff">NEXUS<tspan fill="url(#ogLive)" dx="28">LIVE</tspan></text>
    <text x="376" y="358" font-size="34" font-weight="500" letter-spacing="0" fill="#cdc2ff">Go live. Send diamonds. Cash out beans.</text>
    <g font-size="25" font-weight="600" fill="#ab97ff">
      <text x="376" y="432">Gifting</text>
      <text x="494" y="432">Mini-games</text>
      <text x="672" y="432">Clans</text>
      <text x="772" y="432">Cash-out</text>
    </g>
    <g fill="#7036ff">
      <circle cx="474" cy="424" r="4"/>
      <circle cx="652" cy="424" r="4"/>
      <circle cx="752" cy="424" r="4"/>
    </g>
  </g>

  <g transform="translate(376 470)">
    <rect width="150" height="46" rx="23" fill="#ff2d6f"/>
    <circle cx="30" cy="23" r="8" fill="#fff"/>
    <text x="50" y="31" font-family="Inter, sans-serif" font-size="21" font-weight="800" letter-spacing="2" fill="#fff">LIVE</text>
  </g>
</svg>
