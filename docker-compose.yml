services:
  postgres:
    image: postgres:16-alpine
    container_name: nexuslive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexuslive
    ports:
      - '5432:5432'
    volumes:
      - nexus-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexus -d nexuslive']
      interval: 5s
      timeout: 5s
      retries: 10

  # Planned: presence, viewer counts and gift rate limits.
  redis:
    image: redis:7-alpine
    container_name: nexuslive-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - nexus-redisdata:/data

volumes:
  nexus-pgdata:
  nexus-redisdata:
